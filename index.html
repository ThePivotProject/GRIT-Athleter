<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>GRIT TeamNotSoft</title>
  <style>

:root {
  --surface: #0F0F0F;
  --surface-dark: #0F0F0F;
  --border-strong: rgba(255, 255, 255, 0.12);
  --orange: #C25A14;
  --ink: #EDEBE6;
  --muted: #8A8A8A;
  --safe-area-inset-top: 0px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0F0F0F;
    --surface-dark: #0F0F0F;
    --border-strong: rgba(255, 255, 255, 0.12);
    --orange: #C25A14;
    --ink: #EDEBE6;
    --muted: #8A8A8A;
    --safe-area-inset-top: 0px;
  }
}

/* ---------- compact preflight ---------- */

*, ::before, ::after {
  box-sizing: border-box;
  border-width: 0;
  border-style: solid;
  border-color: #e5e7eb;
}

html {
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  line-height: inherit;
  background: #0F0F0F;
  color: #EDEBE6;
}

h1, h2, h3, h4, h5, h6, p, blockquote, dl, dd, figure, pre {
  margin: 0;
}

h1, h2, h3, h4, h5, h6 {
  font-size: inherit;
  font-weight: inherit;
}

ol, ul, menu {
  list-style: none;
  margin: 0;
  padding: 0;
}

a {
  color: inherit;
  text-decoration: inherit;
}

button, input, optgroup, select, textarea {
  font-family: inherit;
  font-size: 100%;
  font-weight: inherit;
  line-height: inherit;
  letter-spacing: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
}

button, input:where([type='button']), input:where([type='reset']), input:where([type='submit']) {
  -webkit-appearance: button;
  background-color: transparent;
  background-image: none;
}

button, [role="button"] {
  cursor: pointer;
}

:disabled {
  cursor: default;
}

img, svg, video, canvas {
  display: block;
  vertical-align: middle;
}

img, video {
  max-width: 100%;
  height: auto;
}

textarea {
  resize: vertical;
}

::-moz-placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::-moz-placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::-moz-selection {
  background: #C25A14;
  color: #0F0F0F;
}

::selection {
  background: #C25A14;
  color: #0F0F0F;
}

/* ---------- type ---------- */

* {
  font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
}

h1, h2, h3, .display {
  font-family: "Anton", Impact, sans-serif;
}

/* ---------- utilities (values match the clean deploy) ---------- */

.pointer-events-none {
  pointer-events: none;
}

.relative {
  position: relative;
}

.fixed {
  position: fixed;
}

.sticky {
  position: sticky;
}

.inset-0 {
  inset: 0px;
}

.top-\[var\(--safe-area-inset-top\)\] {
  top: var(--safe-area-inset-top);
}

.z-0 {
  z-index: 0;
}

.z-10 {
  z-index: 10;
}

.z-40 {
  z-index: 40;
}

.mx-auto {
  margin-left: auto;
  margin-right: auto;
}

.mt-3 {
  margin-top: 0.75rem;
}

.flex {
  display: flex;
}

.grid {
  display: grid;
}

.hidden {
  display: none;
}

.w-full {
  width: 100%;
}

.min-w-0 {
  min-width: 0px;
}

.flex-1 {
  flex: 1 1 0%;
}

.shrink-0 {
  flex-shrink: 0;
}

.cursor-pointer {
  cursor: pointer;
}

.grid-cols-1 {
  grid-template-columns: repeat(1, minmax(0, 1fr));
}

.flex-col {
  flex-direction: column;
}

.flex-wrap {
  flex-wrap: wrap;
}

.items-start {
  align-items: flex-start;
}

.items-end {
  align-items: flex-end;
}

.items-center {
  align-items: center;
}

.justify-center {
  justify-content: center;
}

.justify-between {
  justify-content: space-between;
}

.gap-1 {
  gap: 0.25rem;
}

.gap-2 {
  gap: 0.5rem;
}

.gap-3 {
  gap: 0.75rem;
}

.gap-4 {
  gap: 1rem;
}

.divide-y > :not([hidden]) ~ :not([hidden]) {
  border-top-width: 1px;
}

.divide-white\/10 > :not([hidden]) ~ :not([hidden]) {
  border-color: rgb(255 255 255 / 0.1);
}

.overflow-hidden {
  overflow: hidden;
}

.overflow-x-clip {
  overflow-x: clip;
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.border {
  border-width: 1px;
}

.border-b {
  border-bottom-width: 1px;
}

.border-t {
  border-top-width: 1px;
}

.border-white\/10 {
  border-color: rgb(255 255 255 / 0.1);
}

.border-white\/15 {
  border-color: rgb(255 255 255 / 0.15);
}

.bg-\[\#101010\] {
  background-color: #101010;
}

.bg-\[\#161616\] {
  background-color: #161616;
}

.bg-transparent {
  background-color: transparent;
}

.object-cover {
  -o-object-fit: cover;
     object-fit: cover;
}

.p-4 {
  padding: 1rem;
}

.p-6 {
  padding: 1.5rem;
}

.p-8 {
  padding: 2rem;
}

.p-10 {
  padding: 2.5rem;
}

.px-3 {
  padding-left: 0.75rem;
  padding-right: 0.75rem;
}

.px-4 {
  padding-left: 1rem;
  padding-right: 1rem;
}

.px-5 {
  padding-left: 1.25rem;
  padding-right: 1.25rem;
}

.px-6 {
  padding-left: 1.5rem;
  padding-right: 1.5rem;
}

.py-2 {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}

.py-2\.5 {
  padding-top: 0.625rem;
  padding-bottom: 0.625rem;
}

.py-3 {
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
}

.py-3\.5 {
  padding-top: 0.875rem;
  padding-bottom: 0.875rem;
}

.py-8 {
  padding-top: 2rem;
  padding-bottom: 2rem;
}

.text-center {
  text-align: center;
}

.uppercase {
  text-transform: uppercase;
}

.font-bold {
  font-weight: 700;
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.max-w-\[1600px\] {
  max-width: 1600px;
}

.hover\:\!border-\[\#C25A14\]:hover {
  border-color: #C25A14 !important;
}

/* ---------- buttons ---------- */

.btn-save {
  background: #C25A14;
  color: #0F0F0F;
  transition: filter 150ms ease;
}

.btn-save:hover {
  filter: brightness(1.15);
}

.btn-ghost {
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #EDEBE6;
  transition: border-color 150ms ease, color 150ms ease;
}

.btn-ghost:hover {
  border-color: #C25A14;
  color: #C25A14;
}

@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-\[88px\] {
    top: 88px;
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.45fr_0\.85fr\] {
    grid-template-columns: 1.45fr 0.85fr;
  }
}

.grit-header{top:env(safe-area-inset-top,0px);padding-top:env(safe-area-inset-top,0px);}
.grit-bg{filter:brightness(0.72) !important;}
@media (max-width:640px){
  .grit-header{position:sticky;}
  .grit-header-inner{height:auto !important;min-height:64px !important;padding-top:14px !important;padding-bottom:10px !important;flex-wrap:wrap !important;row-gap:8px;}
  .grit-built{position:static !important;transform:none !important;order:3 !important;width:100% !important;margin-top:2px !important;}
  .grit-built-big{font-size:28px !important;}
  .grit-coach{position:relative !important;z-index:5 !important;}
  .grit-logo{position:relative !important;z-index:5 !important;}
}

/* standalone deploy: squared-off details + mobile header */
button,input,textarea,select{border-radius:4px !important;}
#gritLandingVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;display:none;background:#000;}
#gritVideoShade{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:rgba(0,0,0,0.55);}
body.show-landing-video #gritLandingVideo{display:block;}
body.show-landing-video #gritVideoShade{display:block;}
@media (max-width:640px){
  .grit-header-inner{height:64px !important;padding-top:10px !important;padding-bottom:8px !important;}
  .grit-wearebuilt span{font-size:15px !important;}
  .grit-built-big{font-size:24px !important;}
  .grit-built-sub{font-size:8px !important;}
  .grit-coach{padding:8px 10px !important;font-size:10px !important;}
}

@media (max-width:640px){
  nav[aria-label="Pages"]{flex-wrap:nowrap !important;overflow-x:auto !important;justify-content:flex-start !important;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px !important;padding-bottom:6px !important;margin-left:-16px !important;margin-right:-16px !important;padding-left:16px !important;padding-right:16px !important;}

}

.grit-built{position:static !important;transform:none !important;order:3 !important;width:100% !important;flex-basis:100% !important;white-space:normal !important;}
.grit-built-big{font-size:22px !important;letter-spacing:0 !important;line-height:1.1 !important;}
.grit-built-sub{font-size:9px !important;letter-spacing:2px !important;}
h2{font-size:28px !important;line-height:1.1 !important;}
h3{font-size:26px !important;}
.grit-detail{padding-left:8px !important;padding-right:8px !important;}
.grit-detail h3{font-size:22px !important;margin-bottom:10px !important;}
.grit-detail textarea{font-size:16px !important;line-height:1.5 !important;min-height:140px !important;padding:8px 0 !important;}
.grit-desc-inner{padding:12px !important;}
.grit-detail .grit-save-btn{padding:12px !important;font-size:12px !important;margin-top:10px !important;}
.grit-profile{flex-direction:column !important;}
.grit-profile-photo{width:100% !important;max-width:220px !important;margin:0 auto !important;}
