<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>GRIT TeamNotSoft</title>
  <style>

:root {
  --surface: #0F0F0F;
  --surface-dark: #0F0F0F;
  --border-strong: rgba(255, 255, 255, 0.12);
  --orange: #FF4D00;
  --ink: #EDEBE6;
  --muted: #8A8A8A;
  --safe-area-inset-top: 0px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #0F0F0F;
    --surface-dark: #0F0F0F;
    --border-strong: rgba(255, 255, 255, 0.12);
    --orange: #FF4D00;
    --ink: #EDEBE6;
    --muted: #8A8A8A;
    --safe-area-inset-top: 0px;
  }
}

/* ---------- compact preflight ---------- */

*, ::before, ::after {
  box-sizing: border-box;
  border-width: 0;
  border-style: solid;
  border-color: #e5e7eb;
}

html {
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  line-height: inherit;
  background: #0F0F0F;
  color: #EDEBE6;
}

h1, h2, h3, h4, h5, h6, p, blockquote, dl, dd, figure, pre {
  margin: 0;
}

h1, h2, h3, h4, h5, h6 {
  font-size: inherit;
  font-weight: inherit;
}

ol, ul, menu {
  list-style: none;
  margin: 0;
  padding: 0;
}

a {
  color: inherit;
  text-decoration: inherit;
}

button, input, optgroup, select, textarea {
  font-family: inherit;
  font-size: 100%;
  font-weight: inherit;
  line-height: inherit;
  letter-spacing: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
}

button, input:where([type='button']), input:where([type='reset']), input:where([type='submit']) {
  -webkit-appearance: button;
  background-color: transparent;
  background-image: none;
}

button, [role="button"] {
  cursor: pointer;
}

:disabled {
  cursor: default;
}

img, svg, video, canvas {
  display: block;
  vertical-align: middle;
}

img, video {
  max-width: 100%;
  height: auto;
}

textarea {
  resize: vertical;
}

::-moz-placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::-moz-placeholder {
  color: rgba(255, 255, 255, 0.40);
  opacity: 1;
}

::-moz-selection {
  background: #FF4D00;
  color: #0F0F0F;
}

::selection {
  background: #FF4D00;
  color: #0F0F0F;
}

/* ---------- type ---------- */

* {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

h1, h2, h3, .display {
  font-family: "Archivo", "Inter", system-ui, sans-serif;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}

/* ---------- utilities (values match the clean deploy) ---------- */

.pointer-events-none {
  pointer-events: none;
}

.relative {
  position: relative;
}

.fixed {
  position: fixed;
}

.sticky {
  position: sticky;
}

.inset-0 {
  inset: 0px;
}

.top-\[var\(--safe-area-inset-top\)\] {
  top: var(--safe-area-inset-top);
}

.z-0 {
  z-index: 0;
}

.z-10 {
  z-index: 10;
}

.z-40 {
  z-index: 40;
}

.mx-auto {
  margin-left: auto;
  margin-right: auto;
}

.mt-3 {
  margin-top: 0.75rem;
}

.flex {
  display: flex;
}

.grid {
  display: grid;
}

.hidden {
  display: none;
}

.w-full {
  width: 100%;
}

.min-w-0 {
  min-width: 0px;
}

.flex-1 {
  flex: 1 1 0%;
}

.shrink-0 {
  flex-shrink: 0;
}

.cursor-pointer {
  cursor: pointer;
}

.grid-cols-1 {
  grid-template-columns: repeat(1, minmax(0, 1fr));
}

.flex-col {
  flex-direction: column;
}

.flex-wrap {
  flex-wrap: wrap;
}

.items-start {
  align-items: flex-start;
}

.items-end {
  align-items: flex-end;
}

.items-center {
  align-items: center;
}

.justify-center {
  justify-content: center;
}

.justify-between {
  justify-content: space-between;
}

.gap-1 {
  gap: 0.25rem;
}

.gap-2 {
  gap: 0.5rem;
}

.gap-3 {
  gap: 0.75rem;
}

.gap-4 {
  gap: 1rem;
}

.divide-y > :not([hidden]) ~ :not([hidden]) {
  border-top-width: 1px;
}

.divide-white\/10 > :not([hidden]) ~ :not([hidden]) {
  border-color: rgb(255 255 255 / 0.1);
}

.overflow-hidden {
  overflow: hidden;
}

.overflow-x-clip {
  overflow-x: clip;
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.border {
  border-width: 1px;
}

.border-b {
  border-bottom-width: 1px;
}

.border-t {
  border-top-width: 1px;
}

.border-white\/10 {
  border-color: rgb(255 255 255 / 0.1);
}

.border-white\/15 {
  border-color: rgb(255 255 255 / 0.15);
}

.bg-\[\#101010\] {
  background-color: #101010;
}

.bg-\[\#161616\] {
  background-color: #161616;
}

.bg-transparent {
  background-color: transparent;
}

.object-cover {
  -o-object-fit: cover;
     object-fit: cover;
}

.p-4 {
  padding: 1rem;
}

.p-6 {
  padding: 1.5rem;
}

.p-8 {
  padding: 2rem;
}

.p-10 {
  padding: 2.5rem;
}

.px-3 {
  padding-left: 0.75rem;
  padding-right: 0.75rem;
}

.px-4 {
  padding-left: 1rem;
  padding-right: 1rem;
}

.px-5 {
  padding-left: 1.25rem;
  padding-right: 1.25rem;
}

.px-6 {
  padding-left: 1.5rem;
  padding-right: 1.5rem;
}

.py-2 {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}

.py-2\.5 {
  padding-top: 0.625rem;
  padding-bottom: 0.625rem;
}

.py-3 {
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
}

.py-3\.5 {
  padding-top: 0.875rem;
  padding-bottom: 0.875rem;
}

.py-8 {
  padding-top: 2rem;
  padding-bottom: 2rem;
}

.text-center {
  text-align: center;
}

.uppercase {
  text-transform: uppercase;
}

.font-bold {
  font-weight: 700;
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.max-w-\[1600px\] {
  max-width: 1600px;
}

.hover\:\!border-\[\#FF4D00\]:hover {
  border-color: #FF4D00 !important;
}

/* ---------- buttons ---------- */

.btn-save {
  background: #FF4D00;
  color: #0F0F0F;
  transition: filter 150ms ease;
}

.btn-save:hover {
  filter: brightness(1.15);
}

.btn-ghost {
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #EDEBE6;
  transition: border-color 150ms ease, color 150ms ease;
}

.btn-ghost:hover {
  border-color: #FF4D00;
  color: #FF4D00;
}

@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-\[88px\] {
    top: 88px;
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.45fr_0\.85fr\] {
    grid-template-columns: 1.45fr 0.85fr;
  }
}

}

<script>
// GRIT progress notes feed: loads the whole feed once,
// then getAthleteNotes(name) returns that athlete's entries, newest first.
// The feed URL comes from Coach > Progress Notes Sync URL (stored in localStorage),
// so changing it in Coach takes effect without re-uploading the site.
// Handles both feed shapes: {athletes:{Name:{entries:[...]}}} (the real script) and {notes:"..."} (old).
// The real script REQUIRES ?key=YOUR_TOKEN on the Coach URL or it returns {error:"unauthorized"}.
window.GRIT_NOTES = (function(){
  var cache = null;
  function feedUrl(){ try{ var cfg = JSON.parse(localStorage.getItem("grit-supabase-cfg")||"null"); return (cfg && cfg.notesUrl) || ""; }catch(e){ return ""; } }
  async function loadProgressNotes(force){
    if (cache && !force) return cache;
    var url = feedUrl();
    if (!url) throw new Error("No sync URL set. Coach: paste the Apps Script web app URL in Coach > Progress Notes Sync URL.");
    var res = await fetch(url);
    var txt = await res.text();
    if (/<html|<!DOCTYPE|<script|<body/i.test(txt)) throw new Error("Notes sync couldn't reach the notes feed - your notes were not changed. Check the notes link in the coach panel and try again.");
    var data;
    try { data = JSON.parse(txt); } catch(e){ data = { notes: txt }; }
    if (data && data.error === "unauthorized") throw new Error("Notes feed said unauthorized - the key in the Coach URL doesn't match SYNC_TOKEN in the Apps Script. Change CHANGE_ME in the script to your token, redeploy, and put ?key=YOUR_TOKEN on the end of the Coach URL.");
    cache = data;
    return data;
  }
  async function getAthleteNotes(athleteName, force){
    var data = await loadProgressNotes(force);
    if (data && data.athletes && data.athletes[athleteName]) {
      var record = data.athletes[athleteName];
      if (record && record.error) return [];
      return (record.entries || []).slice().reverse();
    }
    if (data && typeof data.notes === "string" && data.notes) return [data.notes];
    if (data && data.error) throw new Error("Notes feed error: " + String(data.error));
    return [];
  }
  return { loadProgressNotes: loadProgressNotes, getAthleteNotes: getAthleteNotes, clearCache: function(){ cache = null; } };
})();
</script>
